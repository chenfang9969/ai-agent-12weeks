<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业知识库助手</title>
<link rel="stylesheet" href="/web/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">知</div>
      <div class="brand-text">
        <h1>企业知识库助手</h1>
        <p class="sub" id="subtitle">正在检查服务状态…</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="badge" id="mode-badge" title="回答方式">—</span>
      <button class="ghost" id="btn-reset" title="清空当前对话">清空</button>
    </div>
  </header>

  <main class="chat" id="chat" aria-live="polite">
    <section class="welcome" id="welcome">
      <h2>问点什么？</h2>
      <p>回答只依据企业资料，找到依据才回答，找不到会明确说“资料里没有”。</p>
      <div class="chips" id="chips">
        <button class="chip" data-q="客户投诉怎么处理？">客户投诉怎么处理？</button>
        <button class="chip" data-q="客户说AI答不准怎么办？">客户说 AI 答不准怎么办？</button>
        <button class="chip" data-q="软件服务期多久？">软件服务期多久？</button>
        <button class="chip" data-q="私有化部署要什么服务器？">私有化部署要什么服务器？</button>
      </div>
    </section>
  </main>

  <footer class="composer">
    <form id="form">
      <textarea id="q" rows="1" maxlength="500" placeholder="输入问题，Enter 发送，Shift+Enter 换行" autocomplete="off"></textarea>
      <button type="submit" id="send" class="send">发送</button>
    </form>
    <div class="hintline">
      <span id="hint">按 Enter 发送 · 单次问题最多 500 字</span>
      <span id="stats" class="stats"></span>
    </div>
  </footer>
</div>
<script src="/web/app.js"></script>
</body>
</html>
